[program:laravel-worker]
; ─── Laravel Queue Worker ────────────────────────────────────────────────────
; Processes queued jobs: broadcast events, emails, notifications.
; Adjust /var/www/pinkbunny to your actual deployment path.

process_name=%(program_name)s_%(process_num)02d
command=php /var/www/pinkbunny/artisan queue:work database \
    --sleep=3 \
    --tries=3 \
    --max-time=3600 \
    --queue=default \
    --timeout=90

autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

; Run 2 workers in parallel for throughput
numprocs=2

user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
