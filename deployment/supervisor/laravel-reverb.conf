[program:laravel-reverb]
; ─── Laravel Reverb WebSocket Server ─────────────────────────────────────────
; Keeps the Reverb WebSocket server running persistently.
; Adjust /var/www/pinkbunny to your actual deployment path.

process_name=%(program_name)s
command=php /var/www/pinkbunny/artisan reverb:start \
    --host=0.0.0.0 \
    --port=8080 \
    --no-interaction

autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

; Only one Reverb process (it handles concurrency internally)
numprocs=1

user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
