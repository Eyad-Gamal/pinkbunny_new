# ===========================================================
# Evolution API — Docker Compose (Reference File)
# ===========================================================
# Deploy this on your VPS (82.29.178.124) to run the WhatsApp
# gateway. Steps:
#   1. Copy this file to the VPS
#   2. Run: docker compose -f docker-compose.evolution.yml up -d
#   3. Access the API at http://82.29.178.124:8080
#   4. Create an instance and scan the QR code with WhatsApp
#   5. Set webhook URL to: https://yourdomain.com/api/whatsapp/webhook
# ===========================================================

services:
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Authentication
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-B6D711FCDE4D4FD5936544120E713976}

      # Server
      - SERVER_URL=http://82.29.178.124:8080

      # Database (using SQLite for simplicity)
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:evolution@postgres:5432/evolution

      # Webhook global config
      - WEBHOOK_GLOBAL_ENABLED=false
      - WEBHOOK_GLOBAL_URL=
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true

      # Logging
      - LOG_LEVEL=ERROR
      - DEL_INSTANCE=false
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
    networks:
      - evolution-net

  postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=evolution
      - POSTGRES_DB=evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    networks:
      - evolution-net

volumes:
  evolution_instances:
  evolution_pgdata:

networks:
  evolution-net:
    driver: bridge
